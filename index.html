<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layalina Café</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        vanilla: {
                            50: '#FDFBF7',
                            100: '#F7F2E7',
                            200: '#EFE5D0',
                            300: '#E3D2B4',
                        },
                        blush: {
                            50: '#FDF2F4',
                            100: '#FCE7EB',
                            200: '#F8D1D8',
                            300: '#F2ABB6',
                            500: '#E07A8B',
                            750: '#A34858',
                        },
                        latte: {
                            DEFAULT: '#C8AD93',
                            dark: '#8C6D53'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                        playfair: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F7F2E7; 
            color: #4A3B32;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        
     
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

     
        .slider-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        header {
            background-color: #fffaf0; 
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #f3e5d8;
            margin-bottom: 18px; 
        }

        .hero-section {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero-section img {
            width: 100%;
            height: auto; 
            display: block;
            object-fit: contain; 
            border-radius: 12px;
        }


        .slider-section {
            margin-top: 4px; 
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body class="bg-vanilla-100 flex flex-col min-h-screen">

    <header class="bg-vanilla-50/90 backdrop-blur-md sticky top-0 z-50 border-b border-blush-200 shadow-sm">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2 space-x-reverse">
                <span class="w-2.5 h-2.5 rounded-full bg-blush-500 animate-pulse"></span>
           
                <h1 id="cafe-name" class="font-playfair text-xl md:text-2xl font-bold tracking-wide text-latte-dark">
                    layalina Café
                </h1>
            </div>
            <div class="text-xs uppercase tracking-widest text-latte font-semibold bg-blush-50 px-3 py-1 rounded-full border border-blush-200">
                 المنيو
            </div>
        </div>
    </header>
     
    <main class="w-full max-w-2xl mx-auto flex-grow flex flex-col">
        
        <section class="hero-section px-3 md:px-0">
            <img 
                id="hero-cover-img"
                src="heroimg.jpeg"
                alt="Hero Cover" 
                class="shadow-md bg-vanilla-200"
                onerror="this.src='https://placehold.co/1200x800/E3D2B4/4A3B32?text=Hero+Cover'"
            >
        </section>
        <section class="slider-section bg-vanilla-50 relative flex flex-col shadow-xl rounded-xl overflow-hidden my-1">
            
            <div class="px-4 py-3 bg-white border-b border-blush-100 flex justify-between items-center">
                <h2 class="font-playfair font-bold text-latte-dark text-base md:text-lg flex items-center gap-2">
                    <i class="fa-solid fa-mug-hot text-blush-500 text-sm"></i>
                    صفحات المنيو (<span id="current-slide-num">1</span>/7)
                </h2>
                <div class="text-xs text-latte-dark/70 font-medium">
                    اسحب أو استعرض السهمين
                </div>
            </div>

            <div class="relative w-full overflow-hidden bg-vanilla-200" id="slider-container">
                
                <button id="prev-btn" aria-label="السابق" class="absolute right-3 top-1/2 -translate-y-1/2 z-20 bg-white/90 hover:bg-white text-latte-dark w-10 h-10 rounded-full shadow-lg flex items-center justify-center transition-all duration-200 border border-blush-200 focus:outline-none">
                    <i class="fa-solid fa-chevron-right text-sm"></i>
                </button>
                
                <button id="next-btn" aria-label="التالي" class="absolute left-3 top-1/2 -translate-y-1/2 z-20 bg-white/90 hover:bg-white text-latte-dark w-10 h-10 rounded-full shadow-lg flex items-center justify-center transition-all duration-200 border border-blush-200 focus:outline-none">
                    <i class="fa-solid fa-chevron-left text-sm"></i>
                </button>

                <div class="slider-track w-full" id="slider-track">
                    
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img1.jpeg" data-fallback="https://placehold.co/800x1200/F7F2E7/A34858?text=Menu+Page+1" alt="Menu Image 1" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img2.jpeg" data-fallback="https://placehold.co/800x1200/FCE7EB/A34858?text=Menu+Page+2" alt="Menu Image 2" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img3.jpeg" data-fallback="https://placehold.co/800x1200/F8D1D8/A34858?text=Menu+Page+3" alt="Menu Image 3" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img4.jpeg" data-fallback="https://placehold.co/800x1200/F2ABB6/4A3B32?text=Menu+Page+4" alt="Menu Image 4" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img5.jpeg" data-fallback="https://placehold.co/800x1200/EFE5D0/A34858?text=Menu+Page+5" alt="Menu Image 5" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img6.jpeg" data-fallback="https://placehold.co/800x1200/E3D2B4/4A3B32?text=Menu+Page+6" alt="Menu Image 6" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>
                    <div class="w-full flex-shrink-0 relative">
                        <img src="img7.jpeg" data-fallback="https://placehold.co/800x1200/FDF2F4/A34858?text=Menu+Page+7" alt="Menu Image 7" class="menu-img w-full h-auto block object-contain mx-auto bg-vanilla-100" onerror="handleImageError(this)">
                    </div>

                </div>
            </div>

            <div class="py-3 bg-white border-t border-blush-100 flex justify-center items-center gap-2" id="dots-container">
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-300 transition-all duration-200" data-index="0" aria-label="Slide 1"></button>
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-200 transition-all duration-200" data-index="1" aria-label="Slide 2"></button>
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-200 transition-all duration-200" data-index="2" aria-label="Slide 3"></button>
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-200 transition-all duration-200" data-index="3" aria-label="Slide 4"></button>
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-200 transition-all duration-200" data-index="4" aria-label="Slide 5"></button>
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-200 transition-all duration-200" data-index="5" aria-label="Slide 6"></button>
                <button class="dot w-2.5 h-2.5 rounded-full bg-blush-200 transition-all duration-200" data-index="6" aria-label="Slide 7"></button>
            </div>

        </section>

        <footer class="bg-vanilla-100 text-center py-4 text-xs text-latte-dark/80 border-t border-blush-200 mt-auto">
            <p>جميع الحقوق محفوظة &copy; <span id="footer-year">2026</span> <span class="font-semibold text-blush-750">eng : sahar reda only for layalina Café</span></p>
        </footer>
    </main>

    <script>

        function handleImageError(img) {
            const fallback = img.getAttribute('data-fallback');
            if (img.src !== fallback) {
                img.src = fallback;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('footer-year').textContent = new Date().getFullYear();

            const track = document.getElementById('slider-track');
            const slides = track.children;
            const totalSlides = slides.length;
            const nextBtn = document.getElementById('next-btn');
            const prevBtn = document.getElementById('prev-btn');
            const currentSlideNum = document.getElementById('current-slide-num');
            const dots = document.querySelectorAll('.dot');

            let currentIndex = 0;


            function updateSlider() {
                track.style.transform = `translateX(${currentIndex * 100}%)`; // RTL layout transform
                currentSlideNum.textContent = currentIndex + 1;

                dots.forEach((dot, idx) => {
                    if (idx === currentIndex) {
                        dot.classList.remove('bg-blush-200', 'w-2.5');
                        dot.classList.add('bg-blush-500', 'w-6');
                    } else {
                        dot.classList.remove('bg-blush-500', 'w-6');
                        dot.classList.add('bg-blush-200', 'w-2.5');
                    }
                });
            }

            function nextSlide() {
                currentIndex = (currentIndex + 1) % totalSlides;
                updateSlider();
            }

            function prevSlide() {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updateSlider();
            }

            nextBtn.addEventListener('click', nextSlide);
            prevBtn.addEventListener('click', prevSlide);

            dots.forEach((dot, idx) => {
                dot.addEventListener('click', () => {
                    currentIndex = idx;
                    updateSlider();
                });
            });

            let touchStartX = 0;
            let touchEndX = 0;

            track.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            track.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const threshold = 50;
                if (touchEndX - touchStartX > threshold) {
                    prevSlide();
                } else if (touchStartX - touchEndX > threshold) {
                    nextSlide();
                }
            }

            updateSlider();
        });
    </script>
</body>
</html>
